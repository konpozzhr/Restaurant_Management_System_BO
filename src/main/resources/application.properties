spring.application.name=restaurant_management
server.port=8081

# Comma-separated list of browser origins allowed to call /api/**
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# --- PostgreSQL -------------------------------------------------------------
# Override with environment variables in real deployments, e.g.
#   DB_URL, DB_USERNAME, DB_PASSWORD   (never commit real passwords)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/restaurant_management}
spring.datasource.username=${DB_USERNAME:projectuser}
spring.datasource.password=${DB_PASSWORD:SathyaKK}

# "update" creates/alters tables for you while developing.
# For production switch to "validate" and manage the schema with Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Pure REST API: keep the Hibernate session closed after the service layer.
spring.jpa.open-in-view=false

# Product photos arrive as base64 data URLs inside JSON - allow a bit more room.
server.tomcat.max-http-form-post-size=10MB

# Logging
logging.level.root=INFO
logging.level.com.sathya.restaurant_management=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# Seed the starter menu/customers/ingredients into empty tables on startup
app.seed.enabled=true

# --- Authentication ---------------------------------------------------------
# Secret used to sign login tokens (32+ characters). Set it as an environment
# variable in real deployments. If it is empty a random key is generated at
# startup, which signs everybody out on every restart (fine for local dev).
app.jwt.secret=${JWT_SECRET:}
# How long a login lasts, in minutes (480 = 8 hours, about one shift).
app.jwt.expiration-minutes=480

# First-start admin account, created only while the users table is empty.
# If ADMIN_PASSWORD is empty a random password is generated and printed once in the log.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
