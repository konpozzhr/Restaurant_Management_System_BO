    <script>
      // Apply the saved theme before first paint. Default is green.
      try {
        var t = localStorage.getItem("restora:theme");
        document.documentElement.setAttribute("data-theme", t === "orange" ? "orange" : "green");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "green");
      }
    </script>
